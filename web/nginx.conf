server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API + Telegram webhook are proxied to the FastAPI service
    location /api/ { proxy_pass http://api:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location /telegram/ { proxy_pass http://api:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location /health { proxy_pass http://api:8000; }

    # SPA routes (/admin, Mini App)
    location / { try_files $uri /index.html; }

    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
}
